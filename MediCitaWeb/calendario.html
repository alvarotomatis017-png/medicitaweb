<!DOCTYPE html>
<!-- ============================================================
     PÁGINA: calendario.html
     Muestra un calendario mensual generado con JavaScript, donde
     se resaltan los días en los que el paciente tiene una cita
     programada.
     ============================================================ -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario | MediCita Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/calendario.css">
</head>
<body>

    <div id="navbarContenedor"></div>

    <div class="layout-app">
        <div id="sidebarContenedor"></div>

        <main class="contenido-principal">

            <div class="encabezado-pagina">
                <h1>Calendario de Citas</h1>
                <p>Los días marcados en verde tienen al menos una cita programada.</p>
            </div>

            <div class="tarjeta">
                <!-- Encabezado del calendario: flechas para cambiar de mes -->
                <div class="calendario-encabezado">
                    <button id="btnMesAnterior" class="btn-icono"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="tituloMesActual">Mes Año</h2>
                    <button id="btnMesSiguiente" class="btn-icono"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <!-- Cabecera con los nombres de los días de la semana -->
                <div class="calendario-dias-semana">
                    <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span>
                    <span>Jue</span><span>Vie</span><span>Sáb</span>
                </div>

                <!-- Aquí se dibujan dinámicamente las celdas de los días (ver calendario.js) -->
                <div class="calendario-grilla" id="calendarioGrilla"></div>
            </div>

            <!-- Detalle de las citas del día que el usuario seleccione en la grilla -->
            <h2 class="subtitulo-seccion">Detalle del día seleccionado</h2>
            <div class="tarjeta" id="detalleDiaSeleccionado">
                <p class="texto-vacio">Haz clic en un día del calendario para ver el detalle.</p>
            </div>

        </main>
    </div>

    <div id="footerContenedor"></div>

    <script src="js/app.js"></script>
    <script src="js/calendario.js"></script>
</body>
</html>
