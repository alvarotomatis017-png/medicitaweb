<!DOCTYPE html>
<!-- ============================================================
     PÁGINA: perfil.html
     Permite al paciente ver y actualizar su información personal.
     ============================================================ -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | MediCita Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>

    <div id="navbarContenedor"></div>

    <div class="layout-app">
        <div id="sidebarContenedor"></div>

        <main class="contenido-principal">

            <div class="encabezado-pagina">
                <h1>Mi Perfil</h1>
                <p>Consulta y actualiza tu información personal.</p>
            </div>

            <div class="perfil-grid">

                <!-- Tarjeta con el avatar y los datos resumidos -->
                <div class="tarjeta perfil-tarjeta-avatar">
                    <div class="perfil-avatar"><i class="fa-solid fa-circle-user"></i></div>
                    <h2 id="perfilNombreCompleto">Nombre del paciente</h2>
                    <p id="perfilCorreo">correo@ejemplo.com</p>
                    <span class="perfil-etiqueta">Paciente</span>
                </div>

                <!-- Formulario de edición de datos -->
                <div class="tarjeta">
                    <div class="alerta alerta-exito" id="alertaPerfil"></div>

                    <form id="formularioPerfil" novalidate>
                        <div class="fila-formulario">
                            <div class="grupo-formulario" id="grupoPerfilNombre">
                                <label for="perfilNombre">Nombre completo</label>
                                <input type="text" id="perfilNombre">
                                <span class="mensaje-error">Ingresa tu nombre completo.</span>
                            </div>
                            <div class="grupo-formulario" id="grupoPerfilTelefono">
                                <label for="perfilTelefono">Teléfono</label>
                                <input type="tel" id="perfilTelefono">
                                <span class="mensaje-error">Ingresa un teléfono de 9 dígitos.</span>
                            </div>
                        </div>

                        <div class="grupo-formulario">
                            <label for="perfilEmail">Correo electrónico</label>
                            <!-- El correo no se puede editar porque es la clave para iniciar sesión -->
                            <input type="email" id="perfilEmail" disabled>
                        </div>

                        <div class="grupo-formulario">
                            <label for="perfilNotas">Notas médicas (alergias, condiciones, etc.)</label>
                            <textarea id="perfilNotas" rows="4" placeholder="Ej: Alergia a la penicilina"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primario">Guardar cambios</button>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <div id="footerContenedor"></div>

    <script src="js/app.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
