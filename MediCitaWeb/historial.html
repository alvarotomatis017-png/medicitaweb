<!DOCTYPE html>
<!-- ============================================================
     PÁGINA: historial.html
     Muestra el historial de citas médicas YA pasadas del paciente
     (fecha anterior al día de hoy), en formato de tabla.
     ============================================================ -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Médico | MediCita Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/historial.css">
</head>
<body>

    <div id="navbarContenedor"></div>

    <div class="layout-app">
        <div id="sidebarContenedor"></div>

        <main class="contenido-principal">

            <div class="encabezado-pagina">
                <h1>Historial Médico</h1>
                <p>Aquí encontrarás el registro de tus atenciones médicas anteriores.</p>
            </div>

            <!-- Buscador simple para filtrar el historial por especialidad o médico -->
            <div class="grupo-formulario historial-buscador">
                <input type="text" id="buscadorHistorial" placeholder="Buscar por especialidad o médico...">
            </div>

            <div class="tarjeta tarjeta-tabla">
                <table class="tabla-historial">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Especialidad</th>
                            <th>Médico</th>
                            <th>Hora</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <!-- Las filas se generan dinámicamente desde historial.js -->
                    <tbody id="cuerpoTablaHistorial"></tbody>
                </table>
                <p class="texto-vacio" id="mensajeHistorialVacio" style="display:none;">
                    Aún no tienes atenciones médicas registradas en tu historial.
                </p>
            </div>

        </main>
    </div>

    <div id="footerContenedor"></div>

    <script src="js/app.js"></script>
    <script src="js/historial.js"></script>
</body>
</html>
