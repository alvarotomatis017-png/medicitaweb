<!DOCTYPE html>
<!-- ============================================================
     PÁGINA: medicos.html
     Muestra la lista de médicos disponibles en la clínica, con
     un filtro por especialidad. Esta página se muestra distinto
     según si el visitante inició sesión o no:
       - Sin sesión: se ve con el navbar público (sin sidebar).
       - Con sesión: se ve dentro del layout con sidebar.
     Esto se resuelve automáticamente con JavaScript (medicos.js).
     ============================================================ -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestros Médicos | MediCita Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medicos.css">
</head>
<body>

    <div id="navbarContenedor"></div>

    <div class="layout-app">
        <!-- El sidebar solo se inserta aquí si el usuario tiene una sesión activa (ver medicos.js) -->
        <div id="sidebarContenedor"></div>

        <main class="contenido-principal">

            <div class="encabezado-pagina">
                <h1>Nuestros Médicos</h1>
                <p>Conoce a los especialistas disponibles y sus horarios de atención.</p>
            </div>

            <!-- Filtro de especialidad -->
            <div class="grupo-formulario medicos-filtro">
                <label for="filtroEspecialidad">Filtrar por especialidad</label>
                <select id="filtroEspecialidad">
                    <option value="todas">Todas las especialidades</option>
                    <!-- Opciones generadas dinámicamente desde medicos.js -->
                </select>
            </div>

            <!-- Cuadrícula de tarjetas de médicos, generada dinámicamente -->
            <div class="grilla-medicos" id="grillaMedicos"></div>

        </main>
    </div>

    <div id="footerContenedor"></div>

    <script src="js/app.js"></script>
    <script src="js/medicos.js"></script>
</body>
</html>
