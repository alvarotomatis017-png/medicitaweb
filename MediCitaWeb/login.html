<!DOCTYPE html>
<!-- ============================================================
     PÁGINA: login.html
     Permite al paciente iniciar sesión con correo y contraseña.
     Como el proyecto no tiene backend, la validación de las
     credenciales se hace contra los usuarios guardados en
     localStorage (los que se crearon en registro.html).
     ============================================================ -->
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MediCita Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <!-- CSS propio de esta página (se carga DESPUÉS del global para poder sobreescribirlo) -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div id="navbarContenedor"></div>

    <!-- ===================== FORMULARIO DE LOGIN ===================== -->
    <section class="pagina-auth">
        <div class="tarjeta auth-tarjeta">
            <div class="auth-icono">
                <i class="fa-solid fa-stethoscope"></i>
            </div>
            <h1>Bienvenido de nuevo</h1>
            <p class="auth-subtitulo">Ingresa tus datos para acceder a tu panel de citas.</p>

            <!-- Caja de alerta para mostrar errores generales de inicio de sesión -->
            <div class="alerta alerta-info" id="alertaLogin"></div>

            <!-- El atributo novalidate desactiva la validación automática del
                 navegador, porque nosotros la controlamos con JavaScript -->
            <form id="formularioLogin" novalidate>

                <div class="grupo-formulario" id="grupoEmail">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                    <span class="mensaje-error">Ingresa un correo electrónico válido.</span>
                </div>

                <div class="grupo-formulario" id="grupoPassword">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••">
                    <span class="mensaje-error">La contraseña debe tener al menos 6 caracteres.</span>
                </div>

                <button type="submit" class="btn btn-primario btn-ancho-completo">Iniciar Sesión</button>
            </form>

            <!-- Aviso académico: permite entrar sin haberse registrado, para
                 poder mostrar el resto del sistema durante la exposición -->
            <button class="btn btn-contorno btn-ancho-completo" id="btnAccesoDemo">
                Ingresar con cuenta de demostración
            </button>

            <p class="auth-enlace">
                ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </section>

    <div id="footerContenedor"></div>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
